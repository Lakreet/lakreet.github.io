name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.14"
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Check formatting
        run: bun run format:check
      
      - name: Build and check docs
        run: bun run check